# Builds the installers on Windows and macOS, including the public proxy fork and linked toolkit.
# Builds only; releases are signed and published locally (scripts/release.mts, docs/releasing.md).
# Full installers wait for a stable release (promote) or a manual run; every commit on main
# reaches a scheduled nightly update from the local machines (scripts/nightly.mts).
name: build

on:
  release:
    types: [released]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            # Host target only: the Windows installer is x64.
            proxy-targets: ''
            artifacts: |
              desktop/dist/*.exe
          # Apple Silicon runner; electron-builder.ts packages arm64 and x64 disk images.
          - os: macos-latest
            proxy-targets: darwin-arm64 darwin-x64
            artifacts: |
              desktop/dist/*.dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
        with:
          path: desktop
          # appVersion.ts derives the version from all feature and patch commits.
          fetch-depth: 0

      # Same sibling layout as the local builds (package.json link: dependencies).
      - uses: actions/checkout@v7
        with:
          repository: Cujuju/solidjs-toolkit
          ref: main
          path: solidjs-toolkit
          persist-credentials: false

      - uses: actions/checkout@v7
        with:
          repository: Cujuju/CLIProxyAPI
          ref: main
          path: CLIProxyAPI
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: CLIProxyAPI/go.mod
          cache-dependency-path: CLIProxyAPI/go.sum

      # pnpm version from package.json packageManager; Node from package.json engines.node.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: desktop/package.json
          cache: true
          cache_dependency_path: desktop/pnpm-lock.yaml

      - uses: actions/setup-node@v7
        with:
          node-version-file: desktop/package.json
          package-manager-cache: false

      - name: Install toolkit dependencies
        run: pnpm --dir ../solidjs-toolkit install --frozen-lockfile

      - run: pnpm install --frozen-lockfile

      - name: Build the proxy
        shell: bash
        env:
          CLIPROXY_SRC: ${{ github.workspace }}/CLIProxyAPI
        run: pnpm proxy:build ${{ matrix.proxy-targets }}

      - run: pnpm typecheck
      - run: pnpm test

      - name: Package
        run: pnpm package

      - uses: actions/upload-artifact@v7
        with:
          name: spillway-${{ matrix.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
