# Lints, type-checks and tests every push to main and every pull request; `check` is meant to be a required status check.
# The checkout layout matches build.yml: the solidjs-toolkit packages are `link:` dependencies at ../solidjs-toolkit.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: ${{ matrix.os == 'ubuntu-latest' && 'check' || 'windows-release-tests' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
        with:
          path: desktop
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: Cujuju/solidjs-toolkit
          path: solidjs-toolkit
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: desktop/package.json
          cache: true
          cache_dependency_path: desktop/pnpm-lock.yaml
      - uses: actions/setup-node@v7
        with:
          node-version-file: desktop/package.json
          package-manager-cache: false
      - name: Install toolkit dependencies
        working-directory: solidjs-toolkit
        run: pnpm install --frozen-lockfile
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  # macOS: tests, the smoke boot check, and a launch of both packaged architectures (x64 under Rosetta on the arm64 runner).
  macos:
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
        with:
          path: desktop
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: Cujuju/solidjs-toolkit
          path: solidjs-toolkit
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: Cujuju/CLIProxyAPI
          path: CLIProxyAPI
          fetch-depth: 0
          persist-credentials: false
      # The fork has no release tags; the proxy version comes from upstream's reachable v* tags.
      - name: Fetch upstream proxy version tags
        run: git -C ../CLIProxyAPI fetch --no-tags https://github.com/router-for-me/CLIProxyAPI.git "refs/tags/v*:refs/tags/v*"
      - uses: actions/setup-go@v7
        with:
          go-version-file: CLIProxyAPI/go.mod
          cache-dependency-path: CLIProxyAPI/go.sum
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: desktop/package.json
          cache: true
          cache_dependency_path: desktop/pnpm-lock.yaml
      - uses: actions/setup-node@v7
        with:
          node-version-file: desktop/package.json
          package-manager-cache: false
      - name: Install toolkit dependencies
        working-directory: solidjs-toolkit
        run: pnpm install --frozen-lockfile
      - run: pnpm install --frozen-lockfile
      - run: node scripts/build-linked.mjs
      - name: Build the proxy for both architectures
        env:
          CLIPROXY_SRC: ${{ github.workspace }}/CLIProxyAPI
        run: pnpm proxy:build darwin-arm64 darwin-x64
      - run: pnpm test
      - run: pnpm smoke
      - name: Package both architectures (app folders)
        run: pnpm package:dir --arm64 --x64
      - name: Install Rosetta
        run: /usr/sbin/softwareupdate --install-rosetta --agree-to-license
      - name: Launch the arm64 package natively
        run: node scripts/packagedCheck.mts dist/mac-arm64/Spillway.app
      - name: Launch the x64 package under Rosetta
        run: node scripts/packagedCheck.mts dist/mac/Spillway.app --rosetta
