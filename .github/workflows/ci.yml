# Lints, type-checks and tests every push to main and every pull request; `check` is meant to be a required status check.
# The checkout layout matches build.yml: the solidjs-toolkit packages are `link:` dependencies at ../solidjs-toolkit.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
        with:
          path: desktop
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: Cujuju/solidjs-toolkit
          path: solidjs-toolkit
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: desktop/package.json
          cache: true
          cache_dependency_path: desktop/pnpm-lock.yaml
      - uses: actions/setup-node@v7
        with:
          node-version-file: desktop/package.json
          package-manager-cache: false
      - name: Install toolkit dependencies
        working-directory: solidjs-toolkit
        run: pnpm install --frozen-lockfile
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
