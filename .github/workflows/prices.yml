name: prices

on:
  schedule:
    # Hourly UTC across 8 AM–6 PM Pacific in both PST and PDT; the gate job keeps the even Pacific hours.
    # (A `timezone:` schedule never fired here.)
    - cron: '0 0-2,15-23 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: spillway-prices
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run: ${{ steps.hour.outputs.run }}
    steps:
      # 8 AM, 10 AM, noon, 2, 4 and 6 PM Pacific; a run delayed past its hour waits for the next slot.
      - id: hour
        run: |
          hour=$(TZ=America/Los_Angeles date +%-H)
          if [ "${{ github.event_name }}" != schedule ] || { [ $((hour % 2)) -eq 0 ] && [ "$hour" -ge 8 ] && [ "$hour" -le 18 ]; }; then
            echo run=true >> "$GITHUB_OUTPUT"
          else
            echo run=false >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    # A healthy run takes about 15 seconds; this caps a hung runner well before GitHub's 6-hour default.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          package-manager-cache: false
      # Node builtins and src/shared/modelPrices.ts only, so no install step.
      - name: Compare model prices with the pricing pages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/checkPrices.mts
