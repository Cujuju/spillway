name: prices

on:
  schedule:
    # 8 AM, 10 AM, noon, 2, 4 and 6 PM Pacific.
    - cron: '0 8-18/2 * * *'
      timezone: America/Los_Angeles
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: spillway-prices
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    # A healthy run takes about 15 seconds; this caps a hung runner well before GitHub's 6-hour default.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          package-manager-cache: false
      # Node builtins and src/shared/modelPrices.ts only, so no install step.
      - name: Compare model prices with the pricing pages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/checkPrices.mts
